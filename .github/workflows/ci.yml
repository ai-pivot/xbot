name: CI

on:
  push:
    # master = 发布线；experiment/xbot = 迭代主线（2026-10-26 用户令：迭代分支必须有门禁，
    # 否则推送只靠本地三件套，质量会退化）。两者都跑同一套 7 job。
    branches: [master, experiment/xbot]
  pull_request:
    branches: [master, experiment/xbot]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.10.1

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -v ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Test plugin/protocol submodule
        working-directory: plugin/protocol
        run: go test -v -race ./...

      # Plugin modules are SEPARATE Go modules (plugins/*/go.mod) — the root
      # `./...` patterns never reach them, so before this step a plugin could
      # fail to compile or fail its own tests while PR CI stayed green (the
      # breakage would only surface in release.yml's build-plugins job, i.e. at
      # release time). New built-in plugins (xbot.ssh-runner, xbot.genui,
      # xbot.git-fancy, xbot.iteration-stats) are covered by the glob — no name
      # list to maintain. Cross-compiling the release targets here catches
      # platform-specific breakage (e.g. windows-only code) in the PR.
      - name: Build + test plugin modules (separate go.mod under plugins/*)
        run: |
          set -euo pipefail
          for mod in plugins/*/; do
            [ -f "${mod}go.mod" ] || continue
            echo "::group::plugin module ${mod}"
            # Manifest-only / test-only modules (xbot.iteration-stats ships no
            # non-test sources) have no buildable package — `go build ./...`
            # exits 1 with "no packages to build" ⇒ only build real packages;
            # their tests still run below.
            has_src=0
            for f in "${mod}"*.go; do
              case "$f" in
                *_test.go) ;;
                *) [ -f "$f" ] && has_src=1 ;;
              esac
            done
            if [ "$has_src" = "1" ]; then
              (cd "$mod" && go build ./...)
              for target in windows/amd64 linux/arm64 darwin/arm64; do
                echo "  cross-compile ${target}"
                (cd "$mod" && CGO_ENABLED=0 GOOS="${target%%/*}" GOARCH="${target##*/}" go build ./...)
              done
            fi
            (cd "$mod" && go test -race ./...)
            echo "::endgroup::"
          done

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.out

  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -v ./...

      - name: Build CLI binary
        run: go build -v -o xbot-cli.exe ./cmd/xbot-cli

  test-windows:
    name: Test (Windows)
    runs-on: windows-latest
    needs: [build-windows]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        # -timeout 30m（2026-10-22）：Windows runner 的 fsync 极慢（modernc sqlite
        # 每次 WAL 提交走 FlushFileBuffers，叠加 Defender 扫描），实测
        # `xbot/agent` 987 个用例累计 597s、`xbot/channel/web` 344 个用例累计 598s，
        # 正好撞上 go test 默认 10m 兜底 ⇒ 被报成"600s 超时"。超时 dump 里没有任何
        # xbot 侧等锁/等端口的栈（唯一的阻塞帧是 sqlite 的 FlushFileBuffers 系统
        # 调用），所以这是预算问题，不是挂死 —— 给足预算，不放宽任何断言。
        run: go test -v -race -timeout 30m ./...

      - name: Test plugin/protocol submodule
        working-directory: plugin/protocol
        run: go test -v -race ./...

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci --fetch-retries=5 --fetch-retry-maxtimeout=120000

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Test
        working-directory: web
        run: npm run test

      - name: Build
        working-directory: web
        run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Build backend binary
        run: go build -o /tmp/xbot-cli ./cmd/xbot-cli

      - name: Install dependencies
        working-directory: web
        run: npm ci --fetch-retries=5 --fetch-retry-maxtimeout=120000

      - name: Install Playwright browsers
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Start backend server
        env:
          XBOT_HOME: /tmp/xbot-e2e
        run: |
          mkdir -p /tmp/xbot-e2e
          # static_dir is NOT required — E2E tests load the frontend from the
          # vite dev server (port 5199) and proxy /api to the backend (8082).
          cat > /tmp/xbot-e2e/config.json << 'EOF'
          {
            "web": { "enable": true, "host": "127.0.0.1", "port": 8082, "invite_only": false },
            "llm": { "provider": "openai", "base_url": "http://127.0.0.1:9999/v1", "api_key": "ci-fake-key", "model": "gpt-4o-mini" },
            "agent": { "workdir": "." }
          }
          EOF
          nohup /tmp/xbot-cli serve --config /tmp/xbot-e2e/config.json > /tmp/xbot-e2e/server.log 2>&1 &
          echo $! > /tmp/xbot-e2e/server.pid
          for i in $(seq 1 20); do
            if curl -sf -X POST http://127.0.0.1:8082/api/auth/config -H 'Content-Type: application/json' -d '{}' > /dev/null 2>&1; then
              echo "backend up after ${i}s"
              break
            fi
            sleep 1
          done
          # Register the admin user used by REAL-backend E2E tests.
          curl -sf -X POST http://127.0.0.1:8082/api/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"admin"}' || true
          echo "backend ready"

      - name: Run E2E tests (full suite — mock + real backend)
        working-directory: web
        env:
          CI: "true"
          E2E_BASE_URL: "http://localhost:5199"
          E2E_USERNAME: "admin"
          E2E_PASSWORD: "admin"
        # Runs the FULL Playwright suite: mock-backend tests (page.route) AND
        # real-backend tests (login/chat/tabbar/right-sidebar) against the
        # xbot-cli serve instance started above. Limit workers to avoid
        # resource contention on CI runners.
        run: npx playwright test --project=chromium --reporter=line --workers=4

      - name: Stop backend server
        if: always()
        run: |
          if [ -f /tmp/xbot-e2e/server.pid ]; then kill $(cat /tmp/xbot-e2e/server.pid) 2>/dev/null || true; fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: web/test-results/
          retention-days: 7

