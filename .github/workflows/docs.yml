name: Deploy Docs

on:
  push:
    branches: [master]
    paths:
      - "docs-site/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.160.0
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Hugo
        run: |
          set -euo pipefail
          # Download the official release binary instead of `go install`.
          # `go install` resolves the module graph through proxy.golang.org and
          # verifies every module against sum.golang.org; that service
          # intermittently answers INTERNAL_ERROR, which failed this job three
          # times in a row (build never even reached the markdown step). The
          # release tarball is a plain HTTP download, and the checksum file
          # keeps the supply-chain guarantee that sumdb used to provide.
          base="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          archive="hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl -sSfL --retry 5 --retry-delay 2 --retry-all-errors \
            -o "/tmp/${archive}" "${base}/${archive}"
          curl -sSfL --retry 5 --retry-delay 2 --retry-all-errors \
            -o /tmp/hugo_checksums.txt "${base}/hugo_${HUGO_VERSION}_checksums.txt"
          (cd /tmp && grep " ${archive}\$" hugo_checksums.txt | sha256sum -c -)
          sudo tar -xzf "/tmp/${archive}" -C /usr/local/bin hugo
          hugo version

      - name: Build theme assets
        working-directory: docs-site/themes/hugo-geekdoc
        run: npm install && npm run build

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build
        working-directory: docs-site
        run: hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
