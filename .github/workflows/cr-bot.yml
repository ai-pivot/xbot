name: CR Bot

on:
  issue_comment:
    types: [created]

permissions:
  pull-requests: read
  contents: read

jobs:
  cr:
    name: Code Review
    runs-on: ubuntu-latest
    # Only trigger on PR comments starting with /cr
    if: github.event.issue.pull_request && startsWith(github.event.comment.body, '/cr')
    steps:
      - name: Get PR info
        id: pr
        # ⛔ 评论正文/用户名绝不能内联进 run:（`${{ github.event.comment.body }}`）——
        # 评论里出现反引号或 $( ) 会被 shell 当命令替换**执行**（脚本注入），
        # 一条带反引号的 /cr 评论就能把这一步打成 exit 127，机器人静默挂掉、
        # review 不再产生（2026-09-15 事故：三次 /cr 触发全部 failure）。
        # 一律经 env: 传值 —— 值不参与脚本文本拼接。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          # ⛔ `--jq -c '{...}'` 是**错的**：`gh api` 的 `--jq` 只接受一个值，
          # 短横线选项会被当作 jq 程序本身（`--jq` 的值 = `-c`），紧跟的 `'{...}'`
          # 就变成**第二个位置参数** ⇒ `accepts 1 arg(s), received 2` ⇒ 这一步 exit 1，
          # 后面的 webhook 步骤被 skip ⇒ 机器人**静默不产生 review**（2026-09-19 实测：
          # /cr 评论触发的 run 在 "Get PR info" 失败，Trigger 步骤 skipped）。
          # 单行紧凑用 jq 自带 `tostring`（GITHUB_OUTPUT 只接受单行值；不额外依赖 jq 进程）。
          PR_INFO=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq '{number: .number, title: .title, head_ref: .head.ref, base_ref: .base.ref} | tostring')

          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "repo=$REPO" >> "$GITHUB_OUTPUT"
          echo "pr_info=$PR_INFO" >> "$GITHUB_OUTPUT"

      - name: Trigger xbot code review
        env:
          REPO: ${{ steps.pr.outputs.repo }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          COMMENT_USER: ${{ github.event.comment.user.login }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          WEBHOOK_URL: ${{ secrets.XBOT_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.XBOT_WEBHOOK_SECRET }}
        run: |
          # 同样经 env 取值（见上一步注释）：评论正文只作为 jq 参数，绝不进 shell 文本。
          PAYLOAD=$(jq -n \
            --arg repo "$REPO" \
            --argjson pr_num "${PR_NUMBER:-0}" \
            --arg comment_user "$COMMENT_USER" \
            --arg comment_body "$COMMENT_BODY" \
            '{
              repository: {full_name: $repo},
              pull_request: {number: $pr_num},
              comment: {
                user: {login: $comment_user},
                body: $comment_body
              }
            }')

          # Compute HMAC-SHA256 signature
          SIG=$(printf '%s' "$PAYLOAD" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | cut -d' ' -f2)

          # POST to xbot webhook
          RESPONSE=$(curl -sS -w "\n%{http_code}" -X POST \
            "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: sha256=$SIG" \
            -d "$PAYLOAD")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          echo "HTTP status: $HTTP_CODE"
          echo "Response: $BODY"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Webhook request failed (HTTP $HTTP_CODE): $BODY"
            exit 1
          fi

          echo "✅ Code review triggered successfully"
